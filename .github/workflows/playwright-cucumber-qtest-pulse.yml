name: Playwright Cucumber BDD -> qTest Pulse

# Runs when qTest Scenario commits/updates feature files (or step defs / mock server),
# and can also be run manually. Runs the full test suite and posts results directly
# to qTest Pulse via the webhook.

on:
  workflow_dispatch:
  # Triggered by an external webhook (e.g. the qTest Pulse TriggerGitHubActions action)
  # via POST .../dispatches with {"event_type":"run-tests"}.
  repository_dispatch:
    types: [run-tests-pulse]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # github.server_url is set automatically by GitHub Actions for both GitHub Cloud
      # and GitHub Enterprise Server — no extra input needed.
      GITHUB_SERVER_URL: ${{ github.server_url }}
      GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # The tests use Playwright's APIRequestContext (no browser), so the
      # browser binaries are not required. Uncomment if you add UI tests.
      # - name: Install Playwright browsers
      #   run: npx playwright install --with-deps chromium

      - name: Detect last saved feature
        id: features
        run: |
          FILE=$(git log -1 --name-only --pretty=format: -- 'features/*.feature' | head -1)
          if [ -n "$FILE" ]; then
            echo "Feature file detected: $FILE"
          else
            echo "No feature file found in last commit — running all features"
            FILE="features/"
          fi
          echo "path=$FILE" >> $GITHUB_OUTPUT

      - name: Run Cucumber tests
        # Cucumber exits non-zero when scenarios fail; we still want to report
        # those results to Pulse, so don't fail the job here.
        run: npx cucumber-js --config config/cucumber.js ${{ steps.features.outputs.path }}
        continue-on-error: true

      - name: Upload Cucumber report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cucumber-report
          path: reports/cucumber-report.json
          if-no-files-found: error

      - name: Send results to qTest Pulse
        if: always()
        env:
          PULSE_WEBHOOK_URL: ${{ secrets.PULSE_WEBHOOK_URL }}
          QTEST_PROJECT_ID: ${{ secrets.QTEST_PROJECT_ID }}
          QTEST_TEST_CYCLE_ID: ${{ secrets.QTEST_TEST_CYCLE_ID }}
        run: npm run post-results
